name: Release portable ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish win-x64 portable build
        shell: pwsh
        run: |
          dotnet restore
          dotnet publish BatteryDoctor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish/win-x64
          $zip = "BatteryDoctor-$env:GITHUB_REF_NAME-win-x64-portable.zip"
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath $zip -CompressionLevel Optimal
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryDoctor-${{ github.ref_name }}-win-x64-portable
          path: ${{ env.ZIP_PATH }}
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:ZIP_PATH" --title "Battery Doctor $env:GITHUB_REF_NAME" --generate-notes
